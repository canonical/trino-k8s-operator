name: Publish to edge

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    # Keep in sync with extra-ignored-file-patterns in integration_test.yaml:
    # integration tests skip these changes, so there is no build to publish.
    paths-ignore:
      - apm.yml
      - apm.lock.yaml
      - .agents/**
      - .github/agents/**
      - .github/instructions/**

jobs:
  publish:
    uses: canonical/operator-workflows/.github/workflows/publish_charm.yaml@main
    secrets: inherit
    permissions:
      contents: write
      packages: write
      actions: read
    with:
      channel: latest/edge
